baseURL = "https://retrobun.com/"
languageCode = "en-us"
title = "Retrobun"
theme = "re-terminal"
enableGitInfo = false

[pagination]
  pagerSize = 5


[params]
  contentTypeName = "posts"
  themeColor = "pink"        # choose: orange, blue, red, green, pink, paper
  subtitle = "Beginner-friendly retro game collecting guides, authenticity checks, and shelf-worthy stories."
  keywords = ["retro games", "game collecting", "pokemon", "nintendo ds", "authenticity guides", "cib"]
  showMenuItems = 3
  fullWidthTheme = true
  centerTheme = false
  autoCover = true
  showLastUpdated = false
  ReadMore = "Read more"

  [params.banner]
    dismissible = false
    url = "/about"

[languages]
  [languages.en]
    languageName = "English"
    title = "Retrobun"
    subtitle = "Spot the real. Play the retro."
    owner = "Jenny"
    keywords = ["retro", "gaming", "fake", "collecting", "guides"]
    copyright = "© 2025 Jennybun"
  menuMore = "More"
  readOtherPosts = "Other posts"
    newerPosts = "Newer posts"
    olderPosts = "Older posts"
    missingContentMessage = "Page not found..."
    missingBackButtonLabel = "Back to home page"

    [languages.en.params.logo]
      logoText = "Retrobun"
      logoHomeLink = "/"
      logoImage = "images/logo.png"

    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      url = "/about/"

    [[languages.en.menu.main]]
      identifier = "pokemon"
      name = "Pokemon"
      url = "/tags/pokemon/"

    [[languages.en.menu.main]]
      identifier = "collecting"
      name = "Collecting"
      url = "/tags/collecting/"

    [[languages.en.menu.main]]
      identifier = "nintendo ds"
      name = "Nintendo DS"
      url = "/tags/nintendo-ds/"
